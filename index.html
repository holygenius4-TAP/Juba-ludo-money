
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Juba Ludo</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; }
html, body {
  width: 100%;
  height: 100%;
  background: #1e1e24;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 95vw;
  max-width: 480px;
  max-height: 98vh;
  justify-content: center;
}
.board {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  grid-template-rows: repeat(15, 1fr);
  background: #fff;
  border: 4px solid #333;
  box-shadow: 0 8px 16px rgba(0,0,0,0.5);
}
.cell { border: 1px solid #ccc; position: relative; display: flex; justify-content: center; align-items: center; }
.base { grid-row-span: 6; grid-column-span: 6; padding: 10%; display: flex; justify-content: center; align-items: center; }
.red-base { grid-area: 1 / 1 / 7 / 7; background: #ff4d4d; }
.blue-base-placeholder { grid-area: 1 / 10 / 7 / 16; background: #4d94ff; opacity: 0.3; }
.yellow-base-placeholder { grid-area: 10 / 1 / 16 / 7; background: #ffdb4d; opacity: 0.3; }
.green-base { grid-area: 10 / 10 / 16 / 16; background: #2ecc71; }
.base-inner { width: 100%; height: 100%; background: #fff; border-radius: 12px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 10%; gap: 10%; }
.base-spot { background: #eee; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #ccc; }
.center-home { grid-area: 7 / 7 / 10 / 10; position: relative; background: #fff; border: 1px solid #ccc; overflow: hidden; }
.triangle { position: absolute; width: 0; height: 0; }
.red-triangle { border-top: 25px solid transparent; border-bottom: 25px solid transparent; border-left: 25px solid #ff4d4d; top: 50%; left: 0; transform: translateY(-50%); }
.green-triangle { border-top: 25px solid transparent; border-bottom: 25px solid transparent; border-right: 25px solid #2ecc71; top: 50%; right: 0; transform: translateY(-50%); }
.cell.red-path { background: #ff9999; }.cell.green-path { background: #85e0a3; }
.cell.start-red { background: #ff4d4d; }.cell.start-green { background: #2ecc71; }
.token { width: 70%; height: 70%; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.4); cursor: pointer; z-index: 10; }
.token.red { background: #cc0000; }.token.green { background: #1b8a4c; }
.token.movable { animation: pulse 0.8s infinite alternate; border-color: #ffff00; }
@keyframes pulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.15); } }
.controls { width: 100%; margin-top: 12px; background: #2b2b36; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.status-bar { font-size: 1.1rem; font-weight: bold; color: #fff; }
.player-indicator.red-text { color: #ff4d4d; }.player-indicator.green-text { color: #2ecc71; }
.dice-section { display: flex; align-items: center; gap: 15px; }
.dice-box { width: 50px; height: 50px; background: #fff; color: #000; font-size: 1.8rem; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 8px; }
button { padding: 10px 20px; font-size: 1rem; font-weight: bold; background: #4e54c8; color: white; border: none; border-radius: 5px; cursor: pointer; }
.message-box { font-size: 0.9rem; color: #ccc; height: 20px; }

/* PHONE FIX - scale down a bit so full board fits */
@media (max-height: 800px) {
 .game-container { transform: scale(0.85); transform-origin: center center; }
}
@media (max-height: 600px) {
 .game-container { transform: scale(0.70); }
}
</style>
</head>
<body>
<div class="game-container">
<div id="board" class="board">
<div class="base red-base"><div class="base-inner">
<div class="base-spot"><div id="token-red-0" class="token red" onclick="handleTokenClick('red',0)"></div></div>
<div class="base-spot"><div id="token-red-1" class="token red" onclick="handleTokenClick('red',1)"></div></div>
<div class="base-spot"><div id="token-red-2" class="token red" onclick="handleTokenClick('red',2)"></div></div>
<div class="base-spot"><div id="token-red-3" class="token red" onclick="handleTokenClick('red',3)"></div></div>
</div></div>
<div class="base blue-base-placeholder"></div>
<div class="center-home"><div class="triangle red-triangle"></div><div class="triangle green-triangle"></div></div>
<div class="base yellow-base-placeholder"></div>
<div class="base green-base"><div class="base-inner">
<div class="base-spot"><div id="token-green-0" class="token green" onclick="handleTokenClick('green',0)"></div></div>
<div class="base-spot"><div id="token-green-1" class="token green" onclick="handleTokenClick('green',1)"></div></div>
<div class="base-spot"><div id="token-green-2" class="token green" onclick="handleTokenClick('green',2)"></div></div>
<div class="base-spot"><div id="token-green-3" class="token green" onclick="handleTokenClick('green',3)"></div></div>
</div></div>
</div>
<div class="controls">
<div class="status-bar">Turn: <span id="current-player" class="player-indicator red-text">Red</span></div>
<div class="dice-section"><div id="dice-display" class="dice-box">-</div><button id="roll-btn" onclick="rollDice()">Roll Dice</button></div>
<div id="message" class="message-box">Roll the dice to start!</div>
</div>
</div>
<script>
const BOARD_PATH=[{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5},{r:7,c:6},{r:6,c:7},{r:5,c:7},{r:4,c:7},{r:3,c:7},{r:2,c:7},{r:1,c:7},{r:1,c:8},{r:1,c:9},{r:2,c:9},{r:3,c:9},{r:4,c:9},{r:5,c:9},{r:6,c:9},{r:7,c:10},{r:7,c:11},{r:7,c:12},{r:7,c:13},{r:7,c:14},{r:7,c:15},{r:8,c:15},{r:9,c:15},{r:9,c:14},{r:9,c:13},{r:9,c:12},{r:9,c:11},{r:9,c:10},{r:10,c:9},{r:11,c:9},{r:12,c:9},{r:13,c:9},{r:14,c:9},{r:15,c:9},{r:15,c:8},{r:15,c:7},{r:14,c:7},{r:13,c:7},{r:12,c:7},{r:11,c:7},{r:10,c:7},{r:9,c:6},{r:9,c:5},{r:9,c:4},{r:9,c:3},{r:9,c:2},{r:9,c:1},{r:8,c:1},{r:7,c:1}];
const HOME_PATHS={red:[{r:8,c:2},{r:8,c:3},{r:8,c:4},{r:8,c:5},{r:8,c:6},{r:8,c:7}],green:[{r:8,c:14},{r:8,c:13},{r:8,c:12},{r:8,c:11},{r:8,c:10},{r:8,c:9}]};
const START_INDEX={red:0,green:26};
let currentPlayer='red',diceValue=null,hasRolled=false;
let tokens={red:[{position:-1,stepCount:-1},{position:-1,stepCount:-1},{position:-1,stepCount:-1},{position:-1,stepCount:-1}],green:[{position:-1,stepCount:-1},{position:-1,stepCount:-1},{position:-1,stepCount:-1},{position:-1,stepCount:-1}]};
function initBoard(){const b=document.getElementById('board');BOARD_PATH.forEach((coord,idx)=>{const c=document.createElement('div');c.className='cell';c.style.gridArea=`${coord.r} / ${coord.c}`;c.id=`path-${idx}`;if(idx===START_INDEX.red)c.classList.add('start-red');if(idx===START_INDEX.green)c.classList.add('start-green');b.appendChild(c);});['red','green'].forEach(p=>{HOME_PATHS[p].forEach((coord,idx)=>{const c=document.createElement('div');c.className=`cell ${p}-path`;c.style.gridArea=`${coord.r} / ${coord.c}`;c.id=`home-${p}-${idx}`;b.appendChild(c);});});renderTokens();}
function rollDice(){if(hasRolled)return;diceValue=Math.floor(Math.random()*6)+1;document.getElementById('dice-display').innerText=diceValue;hasRolled=true;const valid=checkValidMoves(currentPlayer,diceValue);if(!valid){setMessage(`No valid moves for ${capitalize(currentPlayer)}. Turn passes!`);setTimeout(switchTurn,1200);}else{setMessage(`${capitalize(currentPlayer)} rolled ${diceValue}. Click a token.`);highlightMovableTokens();}}
function checkValidMoves(player,roll){return tokens[player].some(t=>{if(t.stepCount===-1)return roll===6;return(t.stepCount+roll)<=56;});}
function highlightMovableTokens(){tokens[currentPlayer].forEach((t,idx)=>{const el=document.getElementById(`token-${currentPlayer}-${idx}`);const can=(t.stepCount===-1&&diceValue===6)||(t.stepCount>=0&&(t.stepCount+diceValue)<=56);if(can)el.classList.add('movable');});}
function clearHighlights(){document.querySelectorAll('.token').forEach(el=>el.classList.remove('movable'));}
function handleTokenClick(player,tokenIdx){if(!hasRolled||player!==currentPlayer)return;const token=tokens[player][tokenIdx];if(token.stepCount===-1&&diceValue!==6)return;if(token.stepCount>=0&&(token.stepCount+diceValue)>56)return;if(token.stepCount===-1&&diceValue===6){token.stepCount=0;token.position=START_INDEX[player];}else{token.stepCount+=diceValue;if(token.stepCount<51){token.position=(START_INDEX[player]+token.stepCount)%52;}else{token.position=100+(token.stepCount-51);}}clearHighlights();renderTokens();checkWinCondition();hasRolled=false;if(diceValue===6){setMessage(`${capitalize(currentPlayer)} rolled 6 - again!`);}else{switchTurn();}}
function renderTokens(){['red','green'].forEach(player=>{tokens[player].forEach((t,idx)=>{const el=document.getElementById(`token-${player}-${idx}`);if(t.stepCount===-1){const spots=document.querySelectorAll(`.${player}-base.base-spot`);spots[idx].appendChild(el);}else if(t.stepCount<51){document.getElementById(`path-${t.position}`).appendChild(el);}else{const homeIdx=t.stepCount-51;document.getElementById(`home-${player}-${homeIdx}`).appendChild(el);}});});}
function switchTurn(){hasRolled=false;diceValue=null;document.getElementById('dice-display').innerText='-';currentPlayer=(currentPlayer==='red')?'green':'red';const pd=document.getElementById('current-player');pd.innerText=capitalize(currentPlayer);pd.className=`player-indicator ${currentPlayer}-text`;setMessage(`${capitalize(currentPlayer)}'s turn. Roll!`);}
function checkWinCondition(){const isWin=tokens[currentPlayer].every(t=>t.stepCount===56);if(isWin){setMessage(`🎉 Player ${capitalize(currentPlayer)} Wins! 🎉`);document.getElementById('roll-btn').disabled=true;hasRolled=true;}}
function setMessage(m){document.getElementById('message').innerText=m;}
function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}
window.onload=initBoard;
const socket=io("https://juba-ludo-money-1.onrender.com");socket.on("connect",()=>{console.log("Connected!",socket.id)});
</script>
</body>
</html>
